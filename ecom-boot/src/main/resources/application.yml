server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,image/svg+xml
  tomcat:
    max-http-form-post-size: 20MB
    threads:
      max: 200

spring:
  application:
    name: ecom
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecom}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 4
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: ecom-pool
      connection-test-query: select 1

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 1
        max-wait: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true
      static-locations:
        - classpath:/static/
        - file:${ecom.storage.local.root:./data/uploads}/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    jdbc-type-for-null: "NULL"
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ait.mall.core.entity

ecom:
  jwt:
    # Override in production. At least 32 characters.
    secret: ${JWT_SECRET:ecom-platform-dev-secret-key-change-me-32bytes-min}
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
    issuer: ecom
  security:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://localhost:8080
  pay:
    # Master key for encrypting channel credentials at rest. Set this in every
    # real deployment; without it secrets are stored in plain text and a warning
    # is logged on every write.
    secret: ${ECOM_PAY_SECRET:}
    # Public base URL of this deployment. Payment channels require absolute
    # callback URLs, so this must be the externally reachable host in production.
    public-base-url: ${ECOM_PUBLIC_URL:http://localhost:8080}
    # Where a redirect flow sends the browser back to.
    return-path: ${ECOM_PAY_RETURN_PATH:/orders/complete}
  storage:
    type: ${STORAGE_TYPE:local}
    public-base-url: ${STORAGE_PUBLIC_URL:/uploads}
    local:
      root: ${STORAGE_LOCAL_ROOT:./data/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket-name: ${S3_BUCKET:ecom}
      path-style-access: true
      custom-domain: ${S3_CUSTOM_DOMAIN:}
  jobs:
    close-unpaid-ms: 300000
    auto-complete-ms: 3600000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.ait: INFO
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
